<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Worklet Generator Agent</title>
  <desc id="desc">A research-to-execution pipeline connecting multiple sources to structured worklets.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1b35"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1045" cy="55" r="235" fill="url(#glow)"/>
  <circle cx="810" cy="360" r="215" fill="url(#glow)" opacity="0.62"/>

  <g opacity="0.9">
    <path d="M760 120 C815 120 818 160 864 160" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M760 180 C815 180 818 160 864 160" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M760 240 C815 240 818 160 864 160" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M958 160 C1001 160 1002 122 1040 122" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M958 160 C1001 160 1002 198 1040 198" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M958 160 C1001 160 1002 274 1040 274" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="682" y="96" width="78" height="48" rx="12" fill="#0f2944" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="721" y="125" fill="#bae6fd" font-size="12" font-weight="700" text-anchor="middle">FILES</text>
      <rect x="682" y="156" width="78" height="48" rx="12" fill="#0f2944" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="721" y="185" fill="#bae6fd" font-size="12" font-weight="700" text-anchor="middle">LINKS</text>
      <rect x="682" y="216" width="78" height="48" rx="12" fill="#0f2944" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="721" y="245" fill="#bae6fd" font-size="12" font-weight="700" text-anchor="middle">PROMPT</text>
    </g>

    <g filter="url(#softGlow)">
      <rect x="864" y="110" width="94" height="100" rx="20" fill="#18235a" stroke="#818cf8" stroke-width="2"/>
      <circle cx="911" cy="143" r="16" fill="none" stroke="#c4b5fd" stroke-width="2"/>
      <path d="M903 143h16M911 135v16" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
      <text x="911" y="184" fill="#e0e7ff" font-size="12" font-weight="800" text-anchor="middle">AGENT</text>
    </g>

    <g>
      <rect x="1040" y="96" width="105" height="52" rx="13" fill="#25184b" stroke="#c084fc" stroke-opacity="0.65"/>
      <text x="1092" y="126" fill="#e9d5ff" font-size="11" font-weight="800" text-anchor="middle">WORKLET 01</text>
      <rect x="1040" y="172" width="105" height="52" rx="13" fill="#25184b" stroke="#c084fc" stroke-opacity="0.65"/>
      <text x="1092" y="202" fill="#e9d5ff" font-size="11" font-weight="800" text-anchor="middle">WORKLET 02</text>
      <rect x="1040" y="248" width="105" height="52" rx="13" fill="#25184b" stroke="#c084fc" stroke-opacity="0.65"/>
      <text x="1092" y="278" fill="#e9d5ff" font-size="11" font-weight="800" text-anchor="middle">WORKLET 03</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="64" y="54" width="206" height="27" rx="13.5" fill="#0e7490" fill-opacity="0.24" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="82" cy="67.5" r="4" fill="#22d3ee"/>
    <text x="96" y="72" fill="#a5f3fc" font-size="11" font-weight="700" letter-spacing="1.8">AGENTIC RESEARCH SYSTEM</text>

    <text x="64" y="135" fill="#f8fafc" font-size="45" font-weight="800" letter-spacing="-1.2">WORKLET GENERATOR</text>
    <text x="64" y="184" fill="url(#accent)" font-size="45" font-weight="800" letter-spacing="-1.2">AGENT</text>
    <text x="66" y="222" fill="#a9b9d2" font-size="17">From research signals to execution-ready ideas.</text>

    <g font-size="10" font-weight="700" letter-spacing="1.1">
      <rect x="64" y="264" width="128" height="30" rx="15" fill="#0f2944" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="128" y="283" fill="#bae6fd" text-anchor="middle">MULTI-SOURCE</text>
      <rect x="204" y="264" width="138" height="30" rx="15" fill="#18235a" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="273" y="283" fill="#c7d2fe" text-anchor="middle">HUMAN-GUIDED</text>
      <rect x="354" y="264" width="136" height="30" rx="15" fill="#25184b" stroke="#c084fc" stroke-opacity="0.45"/>
      <text x="422" y="283" fill="#e9d5ff" text-anchor="middle">EXPORT-READY</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="23.25" fill="none" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
